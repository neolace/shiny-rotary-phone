name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore EntraAuth.slnx
      - run: dotnet format EntraAuth.slnx --verify-no-changes --severity warn
      - run: dotnet build EntraAuth.slnx --no-restore --nologo

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test EntraAuth.slnx --nologo

  synth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx cdk synth -q -c sampleImage=public.ecr.aws/docker/library/httpd:2.4
